name: Feature request
description: Something Franchisarr should do that it doesn't.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation, not the solution -- "I have two Radarr instances split by resolution and..." rather than "add a dropdown".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you'd expect it to work
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
