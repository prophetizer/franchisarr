# Weekly update pull requests for the three things this repo pins: Python packages, the Docker
# base image (by digest) and GitHub Actions (by commit SHA). Each ecosystem's updates arrive as
# one grouped PR, so it's one review a week rather than a dozen. Nothing merges on its own.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
