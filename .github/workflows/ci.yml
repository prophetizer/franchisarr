name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# A newer push to the same branch makes an older run pointless; release tags always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least privilege: every job reads the code; only the image job may push to GHCR. Giving
# packages:write to the test and audit jobs meant any compromised dependency they install could
# overwrite the published image.
permissions:
  contents: read

# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest, so an OS change (ubuntu-latest
# moves to 26 from 2026-10-19) is a commit someone makes, not a surprise in a release build.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  audit:
    # Known-vulnerable pins fail the build. The 0.11.1 upgrade happened because someone asked
    # for a security check before going public; this is that check, on every push.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      # requirements-dev.txt includes requirements.txt: the image's packages and the test suite's.
      - run: pip-audit -r requirements-dev.txt --desc off

  image:
    # Builds for both architectures on every push, so a broken arm64 build is caught before a
    # release. Pushes only for a version tag: ghcr.io/<owner>/franchisarr:<version> and :latest.
    # The image inherits the repository's visibility, so it is private until the repo is public.
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      # Releases (v* tags) push the version tags and :latest. The develop branch pushes :develop
      # only -- unreleased work for whoever opts in -- carrying its commit as the build id, so its
      # pages' asset URLs change with every push (docs/DEVELOPMENT.md, Branches).
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/develop'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # type=ref,event=branch only names the local build on a branch push, which is never
          # pushed; without some tag metadata-action warns "No Docker tag has been generated".
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build (and push on a tag or develop)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/develop' }}
          build-args: |
            FRANCHISARR_BUILD=${{ github.ref == 'refs/heads/develop' && github.sha || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Full build provenance and an SBOM, attached to the pushed image.
          provenance: mode=max
          sbom: true
