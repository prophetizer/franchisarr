name: Screenshots

# The README screenshots are regenerated whenever the UI changes, from a fixed sample library
# fetched from TMDb (scripts/screenshots.py), and committed back -- so the README never shows a
# layout the app no longer has. Needs a TMDB_API_KEY repository secret (any free v3 key).

on:
  push:
    branches: [master]
    paths:
      - "app/templates/**"
      - "app/static/**"
      - "scripts/screenshots.py"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    # A commit this job makes touches only docs/screenshots, which is not in `paths`, so it
    # cannot retrigger itself.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Don't leave the write token in .git/config for every later step (pip install, the
          # capture script) to read; only the final push step gets it.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright==1.49.1
      - run: python -m playwright install --with-deps chromium
      # Noto Sans is what system-ui resolves to on a typical Linux desktop; without it the
      # runner falls back to DejaVu, which is wider and wraps the nav -- a layout no one sees.
      - run: sudo apt-get install -y -qq fonts-noto-core && fc-cache -f >/dev/null
      - name: Capture
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/screenshots.py
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
          else
            git commit -m "Screenshots: regenerated for $(git rev-parse --short HEAD)"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          fi
