# NOTE: `runs-on: docker` assumes a Forgejo Actions runner registered with that label (the
# common default for a self-hosted act_runner in docker-in-docker/docker mode). Adjust to
# whatever label your actual runner(s) are registered under if this doesn't match.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: docker
    # actions/setup-python only ships prebuilt binaries matched to specific
    # Ubuntu versions -- it doesn't recognize this runner's Debian-based
    # default image at all ("version not found for this operating system").
    # Using an image with Python 3.12 AND Node.js already installed instead
    # sidesteps that entirely: Node is still there for checkout's JS-based
    # post-step, and there's no version-manifest matching involved for Python.
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Run pytest
        run: pytest -v

  # Validates the image actually builds for both architectures on every push. This does NOT
  # push anywhere yet — no registry/credentials are configured until distribution work begins
  # (PROJECT_PLAN.md section 10). Swap in a push step (with GHCR login) once that's ready.
  docker-build:
    runs-on: docker
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (amd64 + arm64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
