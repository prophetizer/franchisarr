services:
  franchisarr:
    build: .
    # Once published: image: ghcr.io/<you>/franchisarr:latest
    container_name: franchisarr
    restart: unless-stopped
    environment:
      # Match these to the user that owns your config directory (`id -u`, `id -g`).
      PUID: 1000
      PGID: 1000
      # Scheduled scans run in this timezone.
      TZ: Etc/UTC
      # Everything else can be set here or in the app's own Settings page. See .env.example.
      # BASE_URL: /franchisarr
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./config:/config

    # Radarr and Sonarr are reached by their address on your own network. If they run in Docker,
    # join their network and use the container names (http://radarr:7878) — see .env.example.
    # A public URL behind a login proxy will not work: an API key cannot get past a login page.
    # networks:
    #   - arrs

# networks:
#   arrs:
#     external: true      # e.g. the network your *arr stack already uses
