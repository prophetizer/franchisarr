# Alembic configuration. Note there is deliberately no `sqlalchemy.url` here — the URL is
# resolved at runtime by app/migrations/env.py from the app's own config (DB_PATH /
# FRANCHISARR_CONFIG_DIR), so migrations always target the same database the app uses.

[alembic]
script_location = app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-8s %(name)s %(message)s
datefmt = %Y-%m-%dT%H:%M:%S
